name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Lint (if using flake8 or pylint)
      run: |
        # Uncomment if you have linting tools in requirements.txt
        # pip install flake8
        # flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Build Docker Image (Validation)
      run: |
        docker build -t ai-platform-observability:test .

  helm-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Lint Helm Chart
      run: |
        cd helm/ai-platform
        helm lint .

    - name: Render Templates
      run: |
        cd helm/